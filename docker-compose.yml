services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: senpai
      POSTGRES_PASSWORD: senpai
      POSTGRES_DB: senpai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senpai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
